tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update contact by id with provided fields'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          age:
            type: number
            example: 14
          gender:
            type: string
            enum: ['male', 'female', 'other']
          avgMark:
            type: number
            example: 8.5
          onDuty:
            type: boolean
            example: true
          parentId:
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
