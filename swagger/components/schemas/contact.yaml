type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Phone number"
    type: string
    example: "+380558471638"
  email:
      description: "Contacts email"
      type: string
      example: "invoker@gmail.com"
  isFavourite:
    type: boolean
  contactType:
    description: "Type of contacts messenger"
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png

